# prefix を Ctrl-a に（Ctrl-b より押しやすい）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# nvim と相性の良い基本設定
set -g escape-time 0            # Esc の遅延をなくす（nvim で重要）
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on          # nvim の autoread などに必要
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true color

# ペイン分割（現在のディレクトリを引き継ぐ）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ペイン移動（vim 風）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# C++ 用レイアウト: 右に40%のペインを作り、フォーカスは左(nvim側)に戻す
bind D split-window -h -l 40% -c "#{pane_current_path}" \; select-pane -L

# 設定の再読み込み
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
